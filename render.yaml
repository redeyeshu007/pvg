# Render Blueprint Configuration for Pavan Vela Grand
# Deploys as a Node.js Web Service running Next.js full-stack with server-side API Route Handlers.
#
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pavan-vela-grand
    env: node
    plan: starter
    region: oregon # or singapore / frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # The following must be configured in Render Dashboard -> Environment:
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
